<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>无水印视频下载 - 哈哥智慧平台</title>
<script>window.__ROOT__='../../../';</script>
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="input.css">
</head>
<body>
<div class="container">
  <div class="header">
    <span class="settings-btn" id="settingsBtn">⚙️</span>
    <span class="logo-emoji">🎬</span>
    <span class="title">无水印视频下载</span>
    <span class="subtitle">支持抖音 / TikTok / 快手 / 小红书 / B站 / 视频号</span>
  </div>

  <!-- 链接输入区 -->
  <div class="input-section">
    <span class="input-label">粘贴分享链接</span>
    <textarea class="url-input" id="urlInput" placeholder="从抖音/快手/小红书等 APP 复制分享链接，粘贴到此处..." maxlength="2000"></textarea>
    <div class="tip-text">
      <span>💡 提示：在视频 APP 点击「分享」→「复制链接」，然后粘贴到上方</span>
    </div>
  </div>

  <!-- 操作按钮（由 JS 控制禁用态与文案） -->
  <div class="action-section">
    <button class="btn-parse" id="btnParse"><span id="btnParseText">🔍 解析视频</span></button>
  </div>

  <!-- 历史记录（由 JS 按数据显隐并渲染） -->
  <div class="history-section" id="historySection" style="display:none;">
    <div class="section-header">
      <span class="section-title">📋 最近解析</span>
      <span class="clear-btn" id="btnClearHistory">清空</span>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- 后端状态提示 -->
  <div class="status-section" id="statusSection" style="display:none;">
    <span class="status-warn">⚠️ 后端服务未连接，请在 app.js 中配置 VIDEO_API_BASE</span>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="password-dialog" id="passwordDialog" style="display:none;">
    <div class="dialog-content">
      <span class="dialog-title">修改密码</span>
      <div class="dialog-field">
        <span class="dialog-label">当前密码</span>
        <input class="dialog-input" id="oldPwd" type="password" placeholder="请输入当前密码">
      </div>
      <div class="dialog-field">
        <span class="dialog-label">新密码</span>
        <input class="dialog-input" id="newPwd" type="password" placeholder="请输入新密码">
      </div>
      <div class="dialog-field">
        <span class="dialog-label">确认新密码</span>
        <input class="dialog-input" id="confirmPwd" type="password" placeholder="再次输入新密码">
      </div>
      <div class="dialog-actions">
        <button class="btn btn-danger" id="btnCancelPwd">取消</button>
        <button class="btn btn-success" id="btnConfirmPwd">确认修改</button>
      </div>
    </div>
  </div>
</div>

<script src="../../../js/wx-shim.js"></script>
<script src="../../../js/ui.js"></script>
<script src="../../../js/app.js"></script>
<script src="../../../js/videoApi.js"></script>
<script src="input.js"></script>
</body>
</html>

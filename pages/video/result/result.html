<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>解析结果 - 评分系统</title>
<script>window.__ROOT__='../../../';</script>
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="result.css">
</head>
<body>
<div class="container">
  <!-- 视频信息卡片 -->
  <div class="info-card">
    <div class="platform-tag">
      <span class="platform-text" id="platformText"></span>
      <span class="type-tag" id="typeTag"></span>
    </div>

    <div class="author-row" id="authorRow" style="display:none;">
      <span class="author-label">作者：</span>
      <span class="author-name" id="authorName"></span>
    </div>

    <div class="title-row">
      <span class="video-title" id="videoTitle"></span>
    </div>

    <!-- 封面图 -->
    <div class="cover-section" id="coverSection" style="display:none;">
      <img class="cover-img" id="coverImg" alt="视频封面">
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn-save" id="btnSave"><span id="btnSaveText">💾 保存到手机相册</span></button>
    <button class="btn-copy" id="btnCopy">📋 复制无水印链接</button>
    <button class="btn-open" id="btnOpen" style="display:none;">🌐 在浏览器中打开</button>
  </div>

  <!-- 图集模式（由 JS 按数据显隐并渲染） -->
  <div class="image-section" id="imageSection" style="display:none;">
    <div class="section-header">
      <span class="section-title" id="imageSectionTitle">📷 图集 (0 张)</span>
      <span class="save-all-btn" id="btnSaveAll">全部保存</span>
    </div>
    <div class="image-grid" id="imageGrid"></div>
  </div>

  <!-- 提示 -->
  <div class="tips-section">
    <span class="tips-title">使用说明</span>
    <span class="tips-item">• 保存的视频将存入手机相册</span>
    <span class="tips-item">• 如保存失败请检查网络或授权</span>
    <span class="tips-item">• 仅供个人学习使用，请勿传播</span>
  </div>
</div>

<script src="../../../js/wx-shim.js"></script>
<script src="../../../js/ui.js"></script>
<script src="../../../js/app.js"></script>
<script src="../../../js/videoApi.js"></script>
<script src="result.js"></script>
</body>
</html>

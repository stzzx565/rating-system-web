<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>评分系统</title>
<script>window.__ROOT__='../../'; window.__TABBAR__='index';</script>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
  <div class="header">
    <span class="logo-emoji">🏆</span>
    <span class="title">评分系统</span>
    <span class="subtitle">尊重：担当：创新：简单：共赢</span>
  </div>

  <!-- 视频下载入口 -->
  <div class="survey-entry" id="entryVideo">
    <span class="survey-entry-ico">🎬</span>
    <div class="survey-entry-txt">
      <span class="survey-entry-name">无水印视频下载</span>
      <span class="survey-entry-sub">抖音 · 快手 · 小红书 · B站 · TikTok · 视频号</span>
    </div>
    <span class="survey-entry-arrow">›</span>
  </div>

  <!-- 问卷调查入口（原生问卷 + JSONBin 云端，另含电脑版 TDuck 入口） -->
  <div class="survey-entry" id="entrySurvey">
    <span class="survey-entry-ico">📝</span>
    <div class="survey-entry-txt">
      <span class="survey-entry-name">问卷调查</span>
      <span class="survey-entry-sub">填写问卷 · 管理问卷 · 查看统计（云端可用）</span>
    </div>
    <span class="survey-entry-arrow">›</span>
  </div>

  <!-- H5 网页版入口说明 -->
  <div class="h5-entry" id="entryH5">
    <span class="survey-entry-ico">🌐</span>
    <div class="survey-entry-txt">
      <span class="survey-entry-name">网页版入口</span>
      <span class="survey-entry-sub">问卷/评分链接可直接发给他人，无需小程序</span>
    </div>
    <span class="survey-entry-arrow">›</span>
  </div>

  <div class="main-content">
    <!-- 宣传文字展示区 -->
    <div class="home-text-section">
      <div class="text-display" id="textDisplay">
        <span class="宣传文字" id="homeTextEl"></span>
      </div>

      <!-- 文字编辑区域（由 JS 按数据显隐） -->
      <div class="text-edit-area" id="editArea" style="display:none;">
        <textarea class="text-editor" id="textEditor" placeholder="请输入宣传文字"></textarea>
        <div class="edit-actions">
          <button class="btn btn-success" id="btnSaveText">保存</button>
          <button class="btn btn-danger" id="btnCancelText">取消</button>
        </div>
      </div>

      <!-- 编辑按钮（未处于编辑状态时显示） -->
      <div class="edit-btn-container" id="editBtnContainer">
        <button class="btn btn-primary" id="btnEditText"><span>✏️ 编辑宣传文字</span></button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="copyright">© 2026 评分系统 v1.0</span>
  </div>

  <!-- 密码输入对话框（管理员验证） -->
  <div class="password-dialog" id="passwordDialog" style="display:none;">
    <div class="dialog-content">
      <span class="dialog-title">管理员验证</span>
      <span class="dialog-desc">请输入管理员密码以编辑宣传文字</span>
      <div class="password-input-container">
        <input class="password-input" id="passwordInput" type="password" placeholder="请输入密码">
      </div>
      <div class="dialog-actions">
        <button class="btn btn-danger" id="btnCancelPwd">取消</button>
        <button class="btn btn-success" id="btnVerifyPwd">确认</button>
      </div>
    </div>
  </div>

  <!-- 视频下载密码对话框 -->
  <div class="password-dialog" id="videoPasswordDialog" style="display:none;">
    <div class="dialog-content">
      <span class="dialog-title">🎬 视频下载</span>
      <span class="dialog-desc">请输入访问密码以使用视频下载功能</span>
      <div class="password-input-container">
        <input class="password-input" id="videoPasswordInput" type="password" placeholder="请输入密码">
      </div>
      <div class="dialog-actions">
        <button class="btn btn-danger" id="btnCancelVideoPwd">取消</button>
        <button class="btn btn-success" id="btnVerifyVideoPwd">确认</button>
      </div>
    </div>
  </div>
</div>

<script src="../../js/wx-shim.js"></script>
<script src="../../js/ui.js"></script>
<script src="../../js/app.js"></script>
<script src="index.js"></script>
</body>
</html>

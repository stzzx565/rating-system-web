<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>多边形分数示意图 - 评分系统</title>
<script>window.__ROOT__='../../../';</script>
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="charts.css">
</head><body>
<div class="container">
  <div class="header">
    <span class="title">多边形分数示意图</span>
    <button class="btn btn-primary" onclick="goBack()"><span>返回</span></button>
  </div>

  <div class="charts-container">
    <div class="chart-title"><span>各组维度得分对比</span></div>

    <!-- 所有组在同一图表中的对比 -->
    <div class="chart-item">
      <div class="chart-header">
        <span class="group-name">所有组对比</span>
      </div>
      <div class="chart-canvas">
        <canvas id="combinedChart" style="width:100%;height:500px;"></canvas>
      </div>
    </div>

    <!-- 各组单独的图表 -->
    <div class="chart-title" style="margin-top:20px;"><span>各组单独图表</span></div>

    <div class="chart-list" id="chartList"></div>
  </div>

  <div class="legend-container">
    <span class="legend-title">图例说明</span>
    <div class="legend-list" id="legendList"></div>
  </div>

  <div class="export-container">
    <button class="btn btn-success" onclick="exportToExcel()"><span>📥 导出到Excel</span></button>
  </div>
</div>
<script src="../../../js/wx-shim.js"></script>
<script src="../../../js/ui.js"></script>
<script src="../../../js/app.js"></script>
<script src="charts.js"></script>
</body></html>
